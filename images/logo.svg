<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420">
  <defs>
    <filter id="purple-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer purple glow ring -->
  <polygon points="14,12 386,12 200,412"
           fill="none"
           stroke="#9B3BF2"
           stroke-width="4"
           filter="url(#purple-glow)"
           opacity="0.85"/>

  <!-- Purple filled outer triangle -->
  <polygon points="22,20 378,20 200,404" fill="#8B2BE2"/>

  <!-- Speed lines (show only in purple band — covered by inner triangles above) -->
  <line x1="0" y1="65"  x2="400" y2="65"  stroke="#FFB800" stroke-width="1.2" opacity="0.35"/>
  <line x1="0" y1="85"  x2="400" y2="85"  stroke="#FFB800" stroke-width="1.2" opacity="0.32"/>
  <line x1="0" y1="105" x2="400" y2="105" stroke="#FFB800" stroke-width="1.2" opacity="0.28"/>
  <line x1="0" y1="125" x2="400" y2="125" stroke="#FFB800" stroke-width="1.2" opacity="0.25"/>
  <line x1="0" y1="145" x2="400" y2="145" stroke="#FFB800" stroke-width="1.2" opacity="0.22"/>
  <line x1="0" y1="165" x2="400" y2="165" stroke="#FFB800" stroke-width="1.2" opacity="0.20"/>
  <line x1="0" y1="185" x2="400" y2="185" stroke="#FFB800" stroke-width="1.2" opacity="0.18"/>
  <line x1="0" y1="205" x2="400" y2="205" stroke="#FFB800" stroke-width="1.2" opacity="0.16"/>
  <line x1="0" y1="225" x2="400" y2="225" stroke="#FFB800" stroke-width="1.2" opacity="0.14"/>
  <line x1="0" y1="245" x2="400" y2="245" stroke="#FFB800" stroke-width="1.2" opacity="0.12"/>
  <line x1="0" y1="265" x2="400" y2="265" stroke="#FFB800" stroke-width="1.2" opacity="0.10"/>
  <line x1="0" y1="285" x2="400" y2="285" stroke="#FFB800" stroke-width="1.2" opacity="0.10"/>
  <line x1="0" y1="305" x2="400" y2="305" stroke="#FFB800" stroke-width="1.2" opacity="0.10"/>
  <line x1="0" y1="325" x2="400" y2="325" stroke="#FFB800" stroke-width="1.2" opacity="0.10"/>
  <line x1="0" y1="345" x2="400" y2="345" stroke="#FFB800" stroke-width="1.2" opacity="0.10"/>
  <line x1="0" y1="365" x2="400" y2="365" stroke="#FFB800" stroke-width="1.2" opacity="0.10"/>
  <line x1="0" y1="385" x2="400" y2="385" stroke="#FFB800" stroke-width="1.2" opacity="0.10"/>

  <!-- Black border triangle (covers speed lines inside, leaving them only in purple band) -->
  <polygon points="44,44 356,44 200,381" fill="#000000"/>

  <!-- Gold/yellow inner triangle -->
  <polygon points="58,58 342,58 200,366" fill="#FFB800"/>

  <!-- PPW lettering -->
  <text x="200" y="188"
        text-anchor="middle"
        fill="#000000"
        font-size="86"
        font-weight="900"
        font-family="'Oswald','Impact','Arial Black','Arial Narrow',sans-serif"
        letter-spacing="2">PPW</text>

  <!-- Decorative double lines + star -->
  <line x1="127" y1="206" x2="162" y2="206" stroke="#000000" stroke-width="2.5"/>
  <line x1="127" y1="213" x2="162" y2="213" stroke="#000000" stroke-width="2.5"/>
  <text x="200" y="218"
        text-anchor="middle"
        fill="#000000"
        font-size="18"
        font-family="Arial, sans-serif">★</text>
  <line x1="238" y1="206" x2="273" y2="206" stroke="#000000" stroke-width="2.5"/>
  <line x1="238" y1="213" x2="273" y2="213" stroke="#000000" stroke-width="2.5"/>

  <!-- PREMIUM PLAYERS WORLDWIDE subtitle -->
  <text x="200" y="237"
        text-anchor="middle"
        fill="#000000"
        font-size="9.5"
        font-family="'Oswald','Arial Narrow',Arial,sans-serif"
        letter-spacing="1.2"
        font-weight="600">PREMIUM PLAYERS WORLDWIDE</text>
</svg>
